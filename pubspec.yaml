name: trip_logbook
description: Vehicle trip logbook for drivers (start/end mileage, purpose, fuel, notes).
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  intl: ^0.20.2
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
