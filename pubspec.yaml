name: trip_logbook
description: Vehicle trip logbook for drivers (start/end mileage, purpose, fuel, notes).
publish_to: 'none'
version: 1.4.2+9

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  intl: ^0.20.2
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# App icon – regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: branding/icon/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: branding/icon/adaptive_foreground.png
  remove_alpha_ios: true
