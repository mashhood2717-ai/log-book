# Codemagic build for iPhone (https://codemagic.io)
#
# Produces an UNSIGNED .ipa to install with Sideloadly, which signs it with
# your own Apple ID during install. No Apple certificates are needed here.
#
# In Codemagic: add this repository → it detects this file → pick the
# "iOS for Sideloadly" workflow → Start new build → choose the branch.
# When it finishes, download the .ipa from the build's Artifacts.

workflows:
  ios-sideload:
    name: iOS for Sideloadly (unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: 3.38.5 # same version used to build the Android app
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Run tests
        script: flutter test
      - name: Build iOS app (no code signing)
        # Flutter creates the Podfile and runs `pod install` itself.
        script: flutter build ios --release --no-codesign
      - name: Package as .ipa
        script: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          rm -rf Payload && mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          mkdir -p build/ipa
          zip -qr "build/ipa/TripLogbook-$VERSION-unsigned.ipa" Payload
          ls -lh build/ipa
    artifacts:
      - build/ipa/*.ipa
